repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # prettier는 로컬 pnpm으로 실행 (mirrors-prettier는 버전 불일치 문제로 제외)
  # CI에서 pnpm format:check으로 검증됨

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.4.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.[jt]sx?$
        additional_dependencies:
          - eslint@10
          - "@eslint/js@10"
          - typescript-eslint@8
          - eslint-config-prettier@10
